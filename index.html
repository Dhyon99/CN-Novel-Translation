<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CN Novel-Translation</title>


    <!-- FONT NAMA WEBSITE -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           DASAR
        ========================= */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f3f4f6;

            color: #1f2937;

            transition:
                background 0.25s ease,
                color 0.25s ease;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            position: relative;

            z-index: 2000;

            transition:
                background 0.25s ease,
                border-color 0.25s ease;

        }


        .menu-button,
        .theme-button {

            width: 45px;

            height: 45px;

            border: none;

            background: transparent;

            color: inherit;

            font-size: 24px;

            cursor: pointer;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease;

        }


        .menu-button:hover,
        .theme-button:hover {

            background: rgba(124, 58, 237, 0.08);

        }


        /* =========================
           NAMA WEBSITE
        ========================= */

        .site-title {

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 23px;

            font-weight: 600;

            letter-spacing: 0.3px;

            text-align: center;

            white-space: nowrap;

            color: #1f2937;

        }


        /* =========================
           MENU
        ========================= */

        .navigation-menu {

            display: none;

            position: absolute;

            top: 60px;

            left: 10px;

            width: 230px;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 8px 0;

            box-shadow:
                0 8px 25px rgba(17, 24, 39, 0.12);

            z-index: 3000;

            overflow: hidden;

        }


        .navigation-menu.active {

            display: block;

        }


        .navigation-menu a,
        .menu-link {

            display: flex;

            width: 100%;

            align-items: center;

            justify-content: space-between;

            padding: 13px 16px;

            border: none;

            background: transparent;

            color: #1f2937;

            text-decoration: none;

            font-size: 16px;

            text-align: left;

            cursor: pointer;

        }


        .navigation-menu a:hover,
        .menu-link:hover {

            background: #f3f0ff;

            color: #7c3aed;

        }


        .menu-item {

            position: relative;

        }


        .submenu {

            display: none;

            padding: 0 0 5px 15px;

        }


        .menu-item.active .submenu {

            display: block;

        }


        .submenu a {

            font-size: 15px;

            padding: 10px 16px;

        }


        /* =========================
           SEARCH
        ========================= */

        .search-container {

            max-width: 900px;

            margin: auto;

            padding: 20px 16px;

        }


        .search-box {

            width: 100%;

            padding: 13px 16px;

            border: 1px solid #e5e7eb;

            border-radius: 8px;

            background: #ffffff;

            color: #1f2937;

            font-size: 16px;

            outline: none;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

        }


        .search-box:focus {

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.10);

        }


        /* =========================
           KONTEN
        ========================= */

        main {

            max-width: 900px;

            margin: auto;

            padding: 0 16px 40px;

        }


        .section-title {

            font-size: 21px;

            margin: 15px 0;

            color: #1f2937;

        }


        /* =========================
           NOVEL BOX
        ========================= */

        .novel-box {

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 16px;

            margin-bottom: 12px;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

        }


        .novel-box:hover {

            border-color: #d8c7fa;

            box-shadow:
                0 4px 14px rgba(124, 58, 237, 0.06);

        }


        .novel-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 6px;

        }


        .novel-info {

            font-size: 14px;

            color: #6b7280;

        }


        /* =========================
           PAGINATION
        ========================= */

        .pagination-container {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 24px;

            padding-top: 20px;

            border-top: 1px solid #e5e7eb;

        }


        .pagination-button {

            min-width: 38px;

            height: 36px;

            padding: 0 10px;

            border: 1px solid #e5e7eb;

            border-radius: 7px;

            background: #ffffff;

            color: #1f2937;

            cursor: pointer;

            font-size: 14px;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;

        }


        .pagination-button:hover {

            border-color: #7c3aed;

            color: #7c3aed;

        }


        .pagination-button.active {

            background: #7c3aed;

            border-color: #7c3aed;

            color: #ffffff;

        }


        .pagination-button.disabled {

            opacity: 0.45;

            cursor: default;

        }


        /* =========================
           HASIL SEARCH
        ========================= */

        .search-results {

            display: none;

        }


        .search-message {

            padding: 20px;

            text-align: center;

            color: #6b7280;

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            padding: 30px 15px;

            margin-top: 30px;

            border-top: 1px solid #e5e7eb;

            background: #ffffff;

            transition:
                background 0.25s ease,
                border-color 0.25s ease;

        }


        footer .footer-title {

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 20px;

            font-weight: 600;

            letter-spacing: 0.3px;

            margin-bottom: 12px;

        }


        footer a {

            color: inherit;

            text-decoration: none;

        }


        footer a:hover {

            color: #7c3aed;

            text-decoration: underline;

        }


        /* COPYRIGHT FONT TETAP */

        footer .copyright {

            margin-top: 12px;

            font-size: 14px;

            color: #6b7280;

        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark-mode {

            background: #111827;

            color: #f3f4f6;

        }


        body.dark-mode header,
        body.dark-mode footer,
        body.dark-mode .novel-box,
        body.dark-mode .search-box,
        body.dark-mode .navigation-menu,
        body.dark-mode .pagination-button {

            background: #1f2937;

        }


        body.dark-mode header,
        body.dark-mode footer,
        body.dark-mode .novel-box,
        body.dark-mode .navigation-menu,
        body.dark-mode .pagination-container {

            border-color: #374151;

        }


        body.dark-mode .site-title {

            color: #f3f4f6;

        }


        body.dark-mode .search-box {

            border-color: #374151;

            color: #f3f4f6;

        }


        body.dark-mode .search-box:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.15);

        }


        body.dark-mode .navigation-menu a,
        body.dark-mode .menu-link {

            color: #f3f4f6;

        }


        body.dark-mode .navigation-menu a:hover,
        body.dark-mode .menu-link:hover {

            background: #2d2345;

            color: #a78bfa;

        }


        body.dark-mode .section-title {

            color: #f3f4f6;

        }


        body.dark-mode .novel-box:hover {

            border-color: #6d4bb5;

            box-shadow:
                0 4px 14px rgba(139, 92, 246, 0.10);

        }


        body.dark-mode .novel-info,
        body.dark-mode .search-message,
        body.dark-mode footer .copyright {

            color: #9ca3af;

        }


        body.dark-mode .pagination-button {

            border-color: #374151;

            color: #f3f4f6;

        }


        body.dark-mode .pagination-button:hover {

            border-color: #8b5cf6;

            color: #a78bfa;

        }


        body.dark-mode .pagination-button.active {

            background: #8b5cf6;

            border-color: #8b5cf6;

            color: #ffffff;

        }


        body.dark-mode footer a:hover {

            color: #a78bfa;

        }


        body.dark-mode .menu-button:hover,
        body.dark-mode .theme-button:hover {

            background: rgba(139, 92, 246, 0.12);

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 768px) {

            header {

                height: 68px;

                padding: 0 30px;

            }


            .navigation-menu {

                top: 68px;

                left: 20px;

            }


            .site-title {

                font-size: 25px;

            }


            .search-container {

                padding: 25px 16px;

            }


            main {

                padding-left: 16px;

                padding-right: 16px;

            }

        }


    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>


        <button
            class="menu-button"
            aria-label="Buka menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <div class="site-title">

            CN Novel-Translation

        </div>


        <button
            class="theme-button"
            aria-label="Ganti tema"
        >
            ☀

        </button>


    </header>



    <!-- =========================
         MENU NAVIGASI
    ========================== -->

    <nav class="navigation-menu">


        <div class="menu-item menu-novel">


            <button class="menu-link">

                <span>Novel</span>

                <span class="novel-arrow">›</span>

            </button>


            <div class="submenu">

                <a href="#">On-going</a>

                <a href="#">Completed</a>

                <a href="#">Hiatus</a>

                <a href="#">Drop</a>

            </div>


        </div>


        <a href="#">

            Bookmark

        </a>


        <a href="#">

            Donasi

        </a>


        <a href="#">

            Login

        </a>


    </nav>



    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search-container">


        <input
            type="search"
            class="search-box"
            placeholder="Cari judul novel..."
            aria-label="Cari judul novel"
        >


    </div>



    <!-- =========================
         KONTEN
    ========================== -->

    <main>


        <!-- =========================
             HALAMAN UTAMA
        ========================== -->

        <div id="home-content">


            <!-- NOVEL RANDOM -->

            <section>


                <h2 class="section-title">

                    Novel Random

                </h2>


                <div id="random-list"></div>


            </section>



            <!-- LATEST UPDATE -->

            <section>


                <h2 class="section-title">

                    Latest Update

                </h2>


                <div id="latest-list"></div>


                <div
                    id="pagination"
                    class="pagination-container"
                ></div>


            </section>


        </div>



        <!-- =========================
             HASIL SEARCH
        ========================== -->

        <section
            id="search-results"
            class="search-results"
        >


            <h2 class="section-title">

                Hasil Pencarian

            </h2>


            <div id="search-list"></div>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>


        <div class="footer-title">

            CN Novel-Translation

        </div>


        <div>

            <a href="index.html">
                Home
            </a>

            •

            <a href="#">
                Donasi
            </a>

        </div>


        <div class="copyright">

            © Copyright 2026-CN Novel-Translation

        </div>


    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =========================
           DATA NOVEL
        ========================= */

        const novels = [

            {
                title: "Contoh Novel Pertama",
                chapter: 26,
                genre: "Fantasy",
                status: "On-going"
            },

            {
                title: "Contoh Novel Kedua",
                chapter: 48,
                genre: "Romance",
                status: "Completed"
            },

            {
                title: "Contoh Novel Ketiga",
                chapter: 12,
                genre: "Xianxia",
                status: "On-going"
            },

            {
                title: "Journey of the Immortal",
                chapter: 95,
                genre: "Xianxia",
                status: "On-going"
            },

            {
                title: "The Heavenly Sword",
                chapter: 73,
                genre: "Wuxia",
                status: "On-going"
            },

            {
                title: "Rebirth of the Saintess",
                chapter: 61,
                genre: "Romance",
                status: "On-going"
            },

            {
                title: "Emperor of the Nine Heavens",
                chapter: 88,
                genre: "Xuanhuan",
                status: "On-going"
            },

            {
                title: "The Immortal's Return",
                chapter: 54,
                genre: "Xianxia",
                status: "Hiatus"
            },

            {
                title: "Sword of Endless Dreams",
                chapter: 37,
                genre: "Fantasy",
                status: "On-going"
            },

            {
                title: "A Saintess's Secret",
                chapter: 42,
                genre: "Romance",
                status: "On-going"
            },

            {
                title: "The Last Heavenly Emperor",
                chapter: 120,
                genre: "Xuanhuan",
                status: "Completed"
            },

            {
                title: "Path of the Azure Dragon",
                chapter: 67,
                genre: "Xianxia",
                status: "On-going"
            },

            {
                title: "Moonlight Over the Immortal Realm",
                chapter: 31,
                genre: "Romance",
                status: "On-going"
            },

            {
                title: "The Hidden Sect",
                chapter: 76,
                genre: "Xianxia",
                status: "On-going"
            },

            {
                title: "Legend of the Fallen Star",
                chapter: 28,
                genre: "Fantasy",
                status: "Hiatus"
            },

            {
                title: "The Reborn Swordmaster",
                chapter: 83,
                genre: "Wuxia",
                status: "On-going"
            },

            {
                title: "Eternal Dream",
                chapter: 46,
                genre: "Fantasy",
                status: "On-going"
            },

            {
                title: "The Villain's Dao",
                chapter: 59,
                genre: "Xuanhuan",
                status: "On-going"
            },

            {
                title: "Nine Realms Immortal",
                chapter: 102,
                genre: "Xianxia",
                status: "On-going"
            },

            {
                title: "The Jade Palace",
                chapter: 25,
                genre: "Romance",
                status: "Completed"
            },

            {
                title: "Beyond the Mortal World",
                chapter: 69,
                genre: "Xianxia",
                status: "On-going"
            },

            {
                title: "The Nameless Immortal",
                chapter: 33,
                genre: "Xianxia",
                status: "On-going"
            }


        ];


        /* =========================
           ELEMEN HALAMAN
        ========================== */

        const randomList =
            document.getElementById("random-list");

        const latestList =
            document.getElementById("latest-list");

        const pagination =
            document.getElementById("pagination");

        const searchBox =
            document.querySelector(".search-box");

        const homeContent =
            document.getElementById("home-content");

        const searchResults =
            document.getElementById("search-results");

        const searchList =
            document.getElementById("search-list");


        /* =========================
           JUMLAH NOVEL PER HALAMAN
        ========================== */

        const itemsPerPage = 10;

        let currentPage = 1;


        /* =========================
           MEMBUAT CARD NOVEL
        ========================== */

        function createNovelCard(novel) {

            return `

                <div class="novel-box">

                    <div class="novel-title">

                        ${novel.title}

                    </div>

                    <div class="novel-info">

                        Chapter ${novel.chapter}
                        •
                        ${novel.genre}
                        •
                        ${novel.status}

                    </div>

                </div>

            `;

        }


        /* =========================
           NOVEL RANDOM
        ========================== */

        function renderRandom() {

            const shuffled =
                [...novels].sort(
                    () => Math.random() - 0.5
                );


            const randomNovels =
                shuffled.slice(0, 3);


            randomList.innerHTML =
                randomNovels
                    .map(createNovelCard)
                    .join("");

        }


        /* =========================
           LATEST UPDATE
        ========================== */

        function renderLatest() {

            const totalPages =
                Math.ceil(
                    novels.length / itemsPerPage
                );


            if (currentPage > totalPages) {

                currentPage = totalPages;

            }


            const start =
                (currentPage - 1) * itemsPerPage;


            const end =
                start + itemsPerPage;


            const pageNovels =
                novels.slice(start, end);


            latestList.innerHTML =
                pageNovels
                    .map(createNovelCard)
                    .join("");


            renderPagination(totalPages);

        }


        /* =========================
           PAGINATION
        ========================== */

        function renderPagination(totalPages) {

            pagination.innerHTML = "";


            if (totalPages <= 1) {

                return;

            }


            /* SEBELUMNYA */

            const previous =
                document.createElement("button");


            previous.className =
                "pagination-button";


            previous.textContent =
                "Sebelumnya";


            previous.disabled =
                currentPage === 1;


            if (currentPage === 1) {

                previous.classList.add("disabled");

            }


            previous.addEventListener(
                "click",
                function () {

                    if (currentPage > 1) {

                        currentPage--;

                        renderLatest();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }

                }
            );


            pagination.appendChild(previous);


            /* NOMOR HALAMAN */

            for (
                let page = 1;
                page <= totalPages;
                page++
            ) {

                const button =
                    document.createElement("button");


                button.className =
                    "pagination-button";


                button.textContent =
                    page;


                if (page === currentPage) {

                    button.classList.add("active");

                }


                button.addEventListener(
                    "click",
                    function () {

                        currentPage = page;

                        renderLatest();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }
                );


                pagination.appendChild(button);

            }


            /* BERIKUTNYA */

            const next =
                document.createElement("button");


            next.className =
                "pagination-button";


            next.textContent =
                "Berikutnya";


            next.disabled =
                currentPage === totalPages;


            if (currentPage === totalPages) {

                next.classList.add("disabled");

            }


            next.addEventListener(
                "click",
                function () {

                    if (currentPage < totalPages) {

                        currentPage++;

                        renderLatest();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }

                }
            );


            pagination.appendChild(next);

        }


        /* =========================
           SEARCH
        ========================== */

        searchBox.addEventListener(
            "input",
            function () {

                const keyword =
                    searchBox.value
                        .trim()
                        .toLowerCase();


                /* KOSONG = KEMBALI KE HOME */

                if (keyword === "") {

                    homeContent.style.display =
                        "block";

                    searchResults.style.display =
                        "none";

                    return;

                }


                /* FILTER JUDUL */

                const results =
                    novels.filter(
                        function (novel) {

                            return novel.title
                                .toLowerCase()
                                .includes(keyword);

                        }
                    );


                homeContent.style.display =
                    "none";


                searchResults.style.display =
                    "block";


                if (results.length === 0) {

                    searchList.innerHTML = `

                        <div class="search-message">

                            Novel tidak ditemukan.

                        </div>

                    `;

                    return;

                }


                searchList.innerHTML =
                    results
                        .map(createNovelCard)
                        .join("");

            }
        );


        /* =========================
           MENU UTAMA
        ========================= */

        const menuButton =
            document.querySelector(".menu-button");

        const navigationMenu =
            document.querySelector(".navigation-menu");


        menuButton.addEventListener(
            "click",
            function () {

                const isOpen =
                    navigationMenu.classList
                        .toggle("active");


                menuButton.setAttribute(
                    "aria-expanded",
                    isOpen
                );

            }
        );


        /* =========================
           SUBMENU NOVEL
        ========================= */

        const novelMenu =
            document.querySelector(".menu-novel");

        const novelButton =
            novelMenu.querySelector(".menu-link");


        novelButton.addEventListener(
            "click",
            function () {

                novelMenu.classList
                    .toggle("active");

            }
        );


        /* =========================
           TUTUP MENU
        ========================= */

        document.addEventListener(
            "click",
            function (event) {

                const clickedInsideMenu =
                    navigationMenu.contains(
                        event.target
                    );


                const clickedMenuButton =
                    menuButton.contains(
                        event.target
                    );


                if (
                    !clickedInsideMenu &&
                    !clickedMenuButton
                ) {

                    navigationMenu.classList
                        .remove("active");


                    menuButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }
        );


        /* =========================
           LIGHT / DARK MODE
        ========================= */

        const themeButton =
            document.querySelector(".theme-button");


        function updateThemeIcon() {

            if (
                document.body.classList
                    .contains("dark-mode")
            ) {

                themeButton.textContent =
                    "☾";

            } else {

                themeButton.textContent =
                    "☀";

            }

        }


        themeButton.addEventListener(
            "click",
            function () {

                document.body.classList
                    .toggle("dark-mode");


                const darkMode =
                    document.body.classList
                        .contains("dark-mode");


                localStorage.setItem(
                    "theme",
                    darkMode
                        ? "dark"
                        : "light"
                );


                updateThemeIcon();

            }
        );


        /* =========================
           MEMUAT TEMA
        ========================== */

        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList
                .add("dark-mode");

        }


        /* =========================
           TAMPILAN AWAL
        ========================== */

        updateThemeIcon();

        renderRandom();

        renderLatest();


    </script>


</body>

</html>
